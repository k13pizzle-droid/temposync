name: TempoSync
options:
  bundleIdPrefix: com.pizzmusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RoutineKit:
    path: ../Packages/RoutineKit
  BeatKit:
    path: ../Packages/BeatKit
  RhythmCoachCore:
    path: ../Packages/RhythmCoachCore

targets:
  TempoSyncWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp/Sources
      - path: WatchApp/Assets.xcassets
      - path: WatchApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: TempoSync
        # Wired to build settings — the plists used to hardcode 1.0/1, making MARKETING_VERSION inert.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pizzmusic.TempoSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizzmusic.TempoSync.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  TempoSyncTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: TVApp
      - path: Sources/LiveCoach/MovePictogram.swift
    info:
      path: TVApp/Info.plist
      properties:
        CFBundleDisplayName: TempoSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
    dependencies:
      - package: RoutineKit
      - package: BeatKit
      - package: RhythmCoachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizzmusic.TempoSync.tv
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  TempoSyncWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: TempoSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizzmusic.TempoSync.widgets
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

  TempoSync:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Fonts
        type: folder
        buildPhase: resources
    entitlements:
      path: TempoSync.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TempoSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard HTTPS only — answers the export-compliance prompt at upload time.
        ITSAppUsesNonExemptEncryption: false
        # Whole-app dark appearance: the ride screens are gradient-dark by design, and letting the
        # menus follow the system's light mode caused jarring shifts at every navigation.
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Lato-Regular.ttf
          - Lato-Bold.ttf
          - Lato-Black.ttf
          - Lato-Light.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking compliance requires all four orientations on iPad.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Handlebar-mounted use: keep the screen awake is handled in-app.
        NSMicrophoneUsageDescription: >-
          TempoSync listens to your music to sync coaching cues to the beat.
          Nothing is recorded or uploaded — only beat and energy features are computed on-device.
        NSAppleMusicUsageDescription: >-
          TempoSync reads what's currently playing so it can line up coaching cues with the track.
        NSHealthUpdateUsageDescription: >-
          TempoSync saves your completed rides to Apple Health as indoor-cycling workouts.
        NSHealthShareUsageDescription: >-
          TempoSync only writes workouts; it never reads your Health data.
    dependencies:
      - package: RoutineKit
      - package: BeatKit
      - package: RhythmCoachCore
      - target: TempoSyncWatch
      - target: TempoSyncWidgets
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        # Automatic signing: open in Xcode once and pick your team under Signing & Capabilities,
        # OR pass DEVELOPMENT_TEAM=XXXXXXXXXX to xcodebuild. A free Apple ID works for development.
        CODE_SIGN_STYLE: Automatic
        # Simulator builds don't sign; device builds need your team selected (see DEVICE_TESTING.md).
